<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AP Configuration Manager</title>
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 32px;
      background: #1a1a2e;
      color: #e6e6ef;
      font-family: 'Segoe UI', Roboto, Cantarell, system-ui, sans-serif;
    }
    .card { max-width: 560px; text-align: center; }
    .icon { margin-bottom: 16px; }
    h1 { margin: 0 0 12px; font-size: 20px; font-weight: 600; }
    p { margin: 0 0 8px; font-size: 14px; line-height: 1.5; color: #b8b8c8; }
    .detail {
      margin: 16px 0 24px;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      font-size: 13px;
      color: #d0d0dc;
      word-break: break-word;
    }
    button {
      font: inherit;
      font-size: 14px;
      padding: 8px 20px;
      color: #fff;
      background: #3a3a5c;
      border: 1px solid #4a4a70;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #45456e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffb454"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </svg>
    </div>
    <h1>The backend could not be started</h1>
    <p>AP Configuration Manager needs its local backend service running to work.</p>
    <p>If another copy of the app is still running, close it and try again. Make sure port 5000 is free.</p>
    <div class="detail" id="detail"></div>
    <button id="close" type="button">Close</button>
  </div>
  <script>
    const detail = new URLSearchParams(location.search).get('detail');
    const el = document.getElementById('detail');
    if (detail) { el.textContent = detail; } else { el.style.display = 'none'; }
    document.getElementById('close').addEventListener('click', () => window.close());
  </script>
</body>
</html>
